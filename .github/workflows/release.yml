name: Package and publish addon

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check addon source
        shell: bash
        run: |
          shopt -s nullglob
          tocs=(*.toc)
          if (( ${#tocs[@]} == 0 )); then
            echo "::error::Import the addon source files into the repository root first."
            exit 1
          fi

      - name: Test packaging (no upload)
        if: github.event_name == 'workflow_dispatch'
        uses: BigWigsMods/packager@v2.6.0
        with:
          args: -d

      - name: Check publication configuration
        if: github.event_name == 'push'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        shell: bash
        run: |
          if [[ -z "$CF_API_TOKEN" || ! "$CF_PROJECT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Set CF_API_TOKEN in repository secrets and numeric CF_PROJECT_ID in repository variables."
            exit 1
          fi

      - name: Package and upload to CurseForge
        if: github.event_name == 'push'
        uses: BigWigsMods/packager@v2.6.0
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        with:
          args: -p ${{ vars.CF_PROJECT_ID }}

      - name: Keep packaged ZIP
        uses: actions/upload-artifact@v4
        with:
          name: addon-package
          path: .release/*.zip
          if-no-files-found: error
